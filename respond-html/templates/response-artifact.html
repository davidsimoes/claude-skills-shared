<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="respond-html-template-version" content="0.3.1" />
  <title>{{TITLE}}</title>

  <!-- Generated by /respond-html — see ~/.claude/skills/respond-html/ for template + generator + spec. Edit content via scripts/<content>.json, then `python3 scripts/generate.py --content <content>.json --out <out-dir>`. Direct edits to this rendered file will be overwritten on next regen. -->

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="{{GOOGLE_FONTS_URL}}" rel="stylesheet" />

  <style>
    :root {
      --bg: #faf8f3;
      --bg-elev: #ffffff;
      --bg-sunken: #f1ede3;
      --ink: #1a1a1a;
      --ink-soft: #444;
      --ink-faint: #777;
      --rule: #e3ddcb;
      --rule-strong: #c9c0a4;
      --accent: {{ACCENT}};
      --accent-soft: color-mix(in srgb, var(--accent) 12%, transparent);
      --accent-ink: color-mix(in srgb, var(--accent) 70%, #000);

      --decision: #1f6f43;
      --decision-bg: color-mix(in srgb, #1f6f43 8%, transparent);
      --tradeoff: #8a4f00;
      --tradeoff-bg: color-mix(in srgb, #8a4f00 10%, transparent);
      --risk: #b1230b;
      --risk-bg: color-mix(in srgb, #b1230b 8%, transparent);
      --recommendation: #0a3f6b;
      --recommendation-bg: color-mix(in srgb, #0a3f6b 8%, transparent);

      --reaction-approve: #1f6f43;
      --reaction-approve-bg: color-mix(in srgb, #1f6f43 10%, transparent);
      --reaction-reject:  #b1230b;
      --reaction-reject-bg:  color-mix(in srgb, #b1230b 10%, transparent);
      --reaction-comment: #8a4f00;
      --reaction-comment-bg: color-mix(in srgb, #8a4f00 10%, transparent);

      --font-body: '{{BODY_FONT}}', Georgia, 'Times New Roman', serif;
      --font-head: '{{HEADING_FONT}}', system-ui, sans-serif;
      --font-mono: ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace;

      --measure: 70ch;
      --gutter: clamp(1rem, 2.5vw, 2.5rem);
    }

    [data-theme="dark"] {
      --bg: #14130f;
      --bg-elev: #1c1a16;
      --bg-sunken: #0f0e0b;
      --ink: #e9e4d4;
      --ink-soft: #b8b09a;
      --ink-faint: #807a68;
      --rule: #2b2820;
      --rule-strong: #45402f;
      --accent: {{ACCENT_DARK}};
      --accent-soft: color-mix(in srgb, var(--accent) 18%, transparent);
      --accent-ink: color-mix(in srgb, var(--accent) 70%, #fff);
      --decision: #6dd4a4;
      --decision-bg: color-mix(in srgb, #6dd4a4 14%, transparent);
      --tradeoff: #f0b85b;
      --tradeoff-bg: color-mix(in srgb, #f0b85b 14%, transparent);
      --risk: #ff7a59;
      --risk-bg: color-mix(in srgb, #ff7a59 14%, transparent);
      --recommendation: #6dafe6;
      --recommendation-bg: color-mix(in srgb, #6dafe6 14%, transparent);
      --reaction-approve: #6dd4a4;
      --reaction-approve-bg: color-mix(in srgb, #6dd4a4 16%, transparent);
      --reaction-reject:  #ff7a59;
      --reaction-reject-bg:  color-mix(in srgb, #ff7a59 16%, transparent);
      --reaction-comment: #f0b85b;
      --reaction-comment-bg: color-mix(in srgb, #f0b85b 16%, transparent);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 5.5rem; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-body);
      font-size: 17px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* --- sticky toolbar --- */
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--bg-elev);
      border-bottom: 1px solid var(--rule);
      padding: 0.75rem var(--gutter);
      display: flex;
      gap: 0.75rem;
      align-items: center;
      flex-wrap: wrap;
      font-family: var(--font-head);
      font-size: 0.85rem;
    }
    .toolbar .stats {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      color: var(--ink-soft);
    }
    .toolbar .stat {
      padding: 0.2rem 0.55rem;
      border-radius: 12px;
      background: var(--bg-sunken);
      font-size: 0.78rem;
      font-weight: 500;
    }
    .toolbar .stat.approve { color: var(--reaction-approve); background: var(--reaction-approve-bg); }
    .toolbar .stat.comment { color: var(--reaction-comment); background: var(--reaction-comment-bg); }
    .toolbar .stat.reject  { color: var(--reaction-reject);  background: var(--reaction-reject-bg); }
    .toolbar .stat.total   { color: var(--ink-faint); }
    .toolbar .spacer { flex: 1; }
    .toolbar button {
      font-family: inherit;
      font-size: 0.8rem;
      padding: 0.4rem 0.85rem;
      border-radius: 4px;
      border: 1px solid var(--rule-strong);
      background: var(--bg);
      color: var(--ink);
      cursor: pointer;
      font-weight: 500;
    }
    .toolbar button:hover { background: var(--accent-soft); border-color: var(--accent); }
    .toolbar button.primary {
      background: var(--accent);
      color: var(--bg-elev);
      border-color: var(--accent);
      font-weight: 600;
    }
    .toolbar button.primary:hover { background: var(--accent-ink); border-color: var(--accent-ink); color: var(--bg-elev); }
    .toolbar button.danger { color: var(--reaction-reject); border-color: var(--reaction-reject); }
    .toolbar button.danger:hover { background: var(--reaction-reject-bg); }
    .toolbar .theme {
      width: 2.1rem;
      height: 2.1rem;
      padding: 0;
      font-size: 0.95rem;
      line-height: 1;
    }

    /* --- main shell --- */
    .shell {
      display: grid;
      grid-template-columns: 16rem minmax(0, 1fr);
      gap: var(--gutter);
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem var(--gutter);
    }
    @media (max-width: 900px) {
      .shell { grid-template-columns: 1fr; }
      .toc { position: static; max-height: none; }
    }

    /* --- TOC sidebar --- */
    .toc {
      position: sticky;
      top: 4.5rem;
      align-self: start;
      max-height: calc(100vh - 6rem);
      overflow-y: auto;
      padding-right: 0.5rem;
      font-family: var(--font-head);
      font-size: 0.875rem;
    }
    .toc h2 {
      font-size: 0.7rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-faint);
      margin: 0 0 0.75rem;
      font-weight: 600;
    }
    .toc ol { list-style: none; padding: 0; margin: 0; counter-reset: toc; }
    .toc li {
      counter-increment: toc;
      margin: 0;
      border-left: 2px solid var(--rule);
      padding-left: 0.75rem;
      position: relative;
    }
    .toc li::before {
      content: counter(toc, decimal-leading-zero);
      color: var(--ink-faint);
      font-size: 0.7rem;
      margin-right: 0.4rem;
    }
    .toc a {
      color: var(--ink-soft);
      text-decoration: none;
      display: inline-block;
      padding: 0.3rem 0;
      transition: color 0.15s;
    }
    .toc a:hover, .toc a.active { color: var(--accent-ink); }
    .toc li:has(a.active) { border-left-color: var(--accent); }
    .toc .toc-mark {
      position: absolute;
      right: 0;
      top: 0.3rem;
      font-size: 0.7rem;
      line-height: 1;
    }
    .toc .toc-mark.approve { color: var(--reaction-approve); }
    .toc .toc-mark.comment { color: var(--reaction-comment); }
    .toc .toc-mark.reject  { color: var(--reaction-reject); }

    /* --- main column --- */
    main { min-width: 0; }
    .hero {
      border-bottom: 1px solid var(--rule);
      padding-bottom: 1.5rem;
      margin-bottom: 2rem;
    }
    .eyebrow {
      font-family: var(--font-head);
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent-ink);
      margin-bottom: 1rem;
    }
    h1 {
      font-family: var(--font-head);
      font-weight: 700;
      font-size: clamp(2rem, 4.5vw, 3rem);
      line-height: 1.05;
      letter-spacing: -0.02em;
      margin: 0 0 0.5rem;
    }
    .subtitle {
      font-size: 1.15rem;
      color: var(--ink-soft);
      max-width: var(--measure);
      margin: 0;
    }

    .bluf {
      background: var(--bg-elev);
      border: 1px solid var(--rule);
      border-left: 4px solid var(--accent);
      padding: 1.25rem 1.5rem;
      margin: 1.5rem 0 2.5rem;
      border-radius: 4px;
      transition: border-left-color 0.2s, background 0.2s;
    }
    .bluf::before {
      content: "Bottom line";
      display: block;
      font-family: var(--font-head);
      font-size: 0.7rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent-ink);
      margin-bottom: 0.5rem;
      font-weight: 600;
    }
    .bluf p { margin: 0; font-size: 1.05rem; }
    .bluf[data-reaction="approve"] { border-left-color: var(--reaction-approve) !important; background: var(--reaction-approve-bg); }
    .bluf[data-reaction="reject"]  { border-left-color: var(--reaction-reject)  !important; background: var(--reaction-reject-bg); }
    .bluf[data-reaction="comment"] { border-left-color: var(--reaction-comment) !important; background: var(--reaction-comment-bg); }

    section {
      margin-bottom: 3rem;
      scroll-margin-top: 5.5rem;
      padding: 0.5rem 1rem;
      margin-left: -1rem;
      margin-right: -1rem;
      border-left: 4px solid transparent;
      border-radius: 4px;
      transition: border-left-color 0.2s, background 0.2s;
    }
    section[data-reaction="approve"] { border-left-color: var(--reaction-approve) !important; background: var(--reaction-approve-bg); }
    section[data-reaction="reject"]  { border-left-color: var(--reaction-reject)  !important; background: var(--reaction-reject-bg); }
    section[data-reaction="comment"] { border-left-color: var(--reaction-comment) !important; background: var(--reaction-comment-bg); }

    h2 {
      font-family: var(--font-head);
      font-weight: 700;
      font-size: 1.6rem;
      letter-spacing: -0.01em;
      margin: 0 0 1rem;
      padding-top: 0.5rem;
    }
    h2 .num {
      font-family: var(--font-mono);
      font-weight: 400;
      color: var(--ink-faint);
      font-size: 0.85em;
      margin-right: 0.6rem;
    }
    h3 {
      font-family: var(--font-head);
      font-weight: 600;
      font-size: 1.15rem;
      margin: 1.75rem 0 0.5rem;
    }
    p { max-width: var(--measure); margin: 0 0 0.9rem; }
    a { color: var(--accent-ink); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
    a:hover { text-decoration-thickness: 2px; }
    ul, ol { max-width: var(--measure); }
    li { margin-bottom: 0.25rem; }
    code {
      font-family: var(--font-mono);
      font-size: 0.88em;
      background: var(--bg-sunken);
      padding: 0.1rem 0.35rem;
      border-radius: 3px;
    }
    pre {
      background: var(--bg-sunken);
      padding: 1rem;
      border-radius: 4px;
      overflow-x: auto;
      border: 1px solid var(--rule);
      font-size: 0.88rem;
    }
    pre code { background: transparent; padding: 0; }

    /* --- callouts --- */
    .callout {
      border-left: 3px solid;
      padding: 0.9rem 1.1rem;
      margin: 1rem 0;
      border-radius: 0 4px 4px 0;
      max-width: var(--measure);
      transition: border-left-color 0.2s, background 0.2s;
    }
    .callout .label {
      font-family: var(--font-head);
      font-size: 0.7rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-weight: 600;
      display: block;
      margin-bottom: 0.35rem;
    }
    .callout p:last-child { margin-bottom: 0; }
    .callout.decision        { border-color: var(--decision);        background: var(--decision-bg); }
    .callout.decision .label { color: var(--decision); }
    .callout.tradeoff        { border-color: var(--tradeoff);        background: var(--tradeoff-bg); }
    .callout.tradeoff .label { color: var(--tradeoff); }
    .callout.risk            { border-color: var(--risk);            background: var(--risk-bg); }
    .callout.risk .label     { color: var(--risk); }
    .callout.recommendation  { border-color: var(--recommendation);  background: var(--recommendation-bg); }
    .callout.recommendation .label { color: var(--recommendation); }
    .callout[data-reaction="approve"] { border-left-color: var(--reaction-approve) !important; background: var(--reaction-approve-bg); }
    .callout[data-reaction="reject"]  { border-left-color: var(--reaction-reject) !important;  background: var(--reaction-reject-bg); }
    .callout[data-reaction="comment"] { border-left-color: var(--reaction-comment) !important; background: var(--reaction-comment-bg); }

    /* --- decision block --- */
    .decision-block {
      background: var(--bg-elev);
      border: 1px solid var(--rule-strong);
      border-left: 4px solid var(--rule-strong);
      border-radius: 6px;
      padding: 1.25rem 1.5rem;
      margin: 1.5rem 0;
      transition: border-left-color 0.2s, background 0.2s;
    }
    .decision-block[data-reaction="approve"] { border-left-color: var(--reaction-approve) !important; background: var(--reaction-approve-bg); }
    .decision-block[data-reaction="reject"]  { border-left-color: var(--reaction-reject)  !important; background: var(--reaction-reject-bg); }
    .decision-block[data-reaction="comment"] { border-left-color: var(--reaction-comment) !important; background: var(--reaction-comment-bg); }
    .decision-block .q {
      font-family: var(--font-head);
      font-weight: 600;
      font-size: 1.05rem;
      margin-bottom: 1rem;
      color: var(--accent-ink);
    }
    .decision-block .q::before {
      content: "Decision ";
      font-size: 0.7rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-faint);
      font-weight: 500;
      display: block;
      margin-bottom: 0.3rem;
    }
    .decision-block .options {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 14rem), 1fr));
      gap: 0.75rem;
      margin-bottom: 1rem;
    }
    .decision-block .option {
      border: 1px solid var(--rule);
      border-radius: 4px;
      padding: 0.85rem 1rem;
      background: var(--bg);
      position: relative;
    }
    .decision-block .option.recommended {
      border-color: var(--accent);
      border-width: 2px;
    }
    .decision-block .option.recommended::after {
      content: "Recommended";
      position: absolute;
      top: -0.6rem;
      left: 0.8rem;
      background: var(--accent);
      color: var(--bg-elev);
      font-family: var(--font-head);
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.15rem 0.5rem;
      border-radius: 2px;
      font-weight: 600;
    }
    .decision-block .option h4 {
      font-family: var(--font-head);
      font-size: 0.95rem;
      margin: 0 0 0.4rem;
      font-weight: 600;
    }
    .decision-block .option p {
      font-size: 0.9rem;
      color: var(--ink-soft);
      margin: 0;
    }

    /* --- comparison table --- */
    table {
      width: 100%;
      max-width: var(--measure);
      border-collapse: collapse;
      margin: 1rem 0 1.5rem;
      font-size: 0.95rem;
    }
    th, td {
      text-align: left;
      padding: 0.6rem 0.75rem;
      border-bottom: 1px solid var(--rule);
      vertical-align: top;
    }
    th {
      font-family: var(--font-head);
      font-weight: 600;
      font-size: 0.8rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink-faint);
      border-bottom: 2px solid var(--rule-strong);
      background: var(--bg-sunken);
    }
    tr:hover td { background: var(--bg-elev); }

    /* --- REACTION COMPONENT --- */
    .react {
      display: flex;
      gap: 0.4rem;
      align-items: center;
      margin-top: 0.85rem;
      flex-wrap: wrap;
      font-family: var(--font-head);
    }
    .react .react-btn {
      background: var(--bg);
      border: 1px solid var(--rule-strong);
      color: var(--ink-soft);
      padding: 0.3rem 0.7rem;
      border-radius: 4px;
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.12s, color 0.12s, border-color 0.12s;
    }
    .react .react-btn:hover { background: var(--bg-sunken); }
    .react .react-btn.approve.active {
      background: var(--reaction-approve);
      border-color: var(--reaction-approve);
      color: var(--bg-elev);
    }
    .react .react-btn.comment.active {
      background: var(--reaction-comment);
      border-color: var(--reaction-comment);
      color: var(--bg-elev);
    }
    .react .react-btn.reject.active {
      background: var(--reaction-reject);
      border-color: var(--reaction-reject);
      color: var(--bg-elev);
    }
    .react .label {
      font-size: 0.72rem;
      color: var(--ink-faint);
      margin-right: 0.3rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .react-comment {
      width: 100%;
      max-width: var(--measure);
      margin-top: 0.5rem;
      padding: 0.55rem 0.7rem;
      border: 1px solid var(--rule);
      border-radius: 4px;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-body);
      font-size: 0.92rem;
      resize: vertical;
      min-height: 2.5rem;
      display: none;
    }
    .react-comment.visible, .react-comment.has-text { display: block; }
    .react-comment.has-text { border-color: var(--reaction-comment); }
    .react-comment:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }

    /* Make sure the global toolbar shows the reaction-tag for callouts/decision-blocks */
    .callout .react,
    .decision-block .react,
    .bluf .react {
      margin-top: 0.6rem;
    }

    /* --- footer --- */
    footer {
      margin-top: 4rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--rule);
      font-family: var(--font-head);
      font-size: 0.75rem;
      color: var(--ink-faint);
    }

    /* --- toast --- */
    .toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      background: var(--accent);
      color: var(--bg-elev);
      padding: 0.75rem 1.2rem;
      border-radius: 6px;
      font-family: var(--font-head);
      font-weight: 600;
      font-size: 0.9rem;
      box-shadow: 0 6px 18px rgba(0,0,0,0.12);
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 100;
    }
    .toast.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }

    @media print {
      .toolbar, .toc, .react, .react-comment, .toast { display: none; }
      .shell { grid-template-columns: 1fr; padding: 0; }
      body { background: white; color: black; }
      .bluf { break-inside: avoid; }
      section { break-inside: avoid; }
      a { color: black; text-decoration: underline; }
    }
  </style>
</head>
<body>

  <div class="toolbar" role="toolbar">
    <div class="stats" id="stats">
      <span class="stat total"><span id="stat-total">0</span> reactable</span>
      <span class="stat approve">✅ <span id="stat-approve">0</span></span>
      <span class="stat comment">💬 <span id="stat-comment">0</span></span>
      <span class="stat reject">❌ <span id="stat-reject">0</span></span>
    </div>
    <div class="spacer"></div>
    <button class="primary" onclick="copyDecisions()">📋 Copy feedback</button>
    <button class="danger" onclick="clearAll()">Clear</button>
    <button class="theme" onclick="toggleTheme()" title="Toggle theme">◐</button>
  </div>

  <div class="shell">

    <aside class="toc">
      <h2>Contents</h2>
      <ol id="toc-list">
        {{TOC_ITEMS}}
      </ol>
    </aside>

    <main>
      <header class="hero">
        <div class="eyebrow">{{EYEBROW}}</div>
        <h1>{{TITLE}}</h1>
        <p class="subtitle">{{SUBTITLE}}</p>
      </header>

      <div class="bluf" data-feedback-id="bluf" data-feedback-label="BLUF">
        <p>{{BLUF}}</p>
        <div class="react" data-target="bluf">
          <span class="label">React:</span>
          <button class="react-btn approve" data-r="approve" title="Approve">✅</button>
          <button class="react-btn comment" data-r="comment" title="Comment">💬</button>
          <button class="react-btn reject"  data-r="reject"  title="Reject">❌</button>
        </div>
        <textarea class="react-comment" data-target="bluf" placeholder="Note on the BLUF…"></textarea>
      </div>

      {{SECTIONS}}

      <footer>
        Generated {{GENERATED_AT}} · /respond-html · React inline with ✅ 💬 ❌, then hit <strong>📋 Copy feedback</strong> in the toolbar.
      </footer>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ============= SAFE STORAGE =============
    // Wraps localStorage so Safari Private Browsing / quota errors don't crash the UI.
    const safeStorage = {
      get(key) { try { return localStorage.getItem(key); } catch (e) { return null; } },
      set(key, val) { try { localStorage.setItem(key, val); return true; } catch (e) { return false; } },
      remove(key) { try { localStorage.removeItem(key); } catch (e) {} }
    };

    // ============= THEME =============
    (function () {
      const url = new URL(location.href);
      const requested = url.searchParams.get('theme');
      const stored = safeStorage.get('respond-html-theme');
      const theme = requested || stored || 'light';
      document.documentElement.setAttribute('data-theme', theme);
    })();
    function toggleTheme() {
      const cur = document.documentElement.getAttribute('data-theme');
      const next = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      safeStorage.set('respond-html-theme', next);
    }

    // ============= FEEDBACK STATE =============
    const STORAGE_KEY = 'respond-html-feedback:' + location.pathname;
    let state = { reactions: {}, version: 2 };
    let storageHealthy = true;
    try {
      const stored = JSON.parse(safeStorage.get(STORAGE_KEY) || 'null');
      if (stored && stored.version === 2) state = stored;
      else if (stored && stored.version !== 2) {
        // Old schema — flag it so the user knows to copy before re-rendering.
        setTimeout(() => toast('Previous reactions were from an older template version and were discarded. Copy feedback before re-rendering.'), 500);
      }
    } catch (e) {}

    function persist() {
      const ok = safeStorage.set(STORAGE_KEY, JSON.stringify(state));
      if (!ok && storageHealthy) {
        storageHealthy = false;
        toast('Storage unavailable (private mode or quota full) — copy feedback now, it won\'t persist.');
      }
    }

    // Cross-tab sync: if another tab writes to (or clears) the same key, reload state and re-render.
    window.addEventListener('storage', e => {
      if (e.key !== STORAGE_KEY) return;
      try {
        if (e.newValue === null) {
          // Tab B called removeItem (e.g., explicit clear+nuke) → reset locally too.
          state = { reactions: {}, version: 2 };
        } else {
          const stored = JSON.parse(e.newValue);
          if (stored && stored.version === 2 && stored.reactions && typeof stored.reactions === 'object') {
            state = stored;
          }
        }
        document.querySelectorAll('[data-feedback-id]').forEach(el => applyReactionUI(el.dataset.feedbackId));
        updateStats();
      } catch (err) {}
    });

    // Assign data-feedback-id + label to any reactable unit that didn't get one
    // (Claude can pre-assign meaningful IDs; this is the fallback.)
    function ensureIds() {
      const seenIds = new Set();
      const seenLabels = new Map();
      let auto = 0;
      document.querySelectorAll('section, .decision-block, .callout, .bluf').forEach(el => {
        if (!el.dataset.feedbackId) {
          const section = el.closest('section');
          const sectionId = section ? (section.id || 'sec') : 'page';
          let kind = 'section';
          if (el.classList.contains('decision-block')) kind = 'decision';
          else if (el.classList.contains('callout')) {
            kind = 'callout-' + (['decision','tradeoff','risk','recommendation'].find(c => el.classList.contains(c)) || 'note');
          } else if (el.classList.contains('bluf')) kind = 'bluf';
          if (el === section) {
            el.dataset.feedbackId = sectionId;
          } else {
            el.dataset.feedbackId = sectionId + '__' + kind + '-' + (++auto);
          }
        }
        // Collision warning — duplicate explicit IDs collapse state silently.
        const id = el.dataset.feedbackId;
        if (seenIds.has(id)) {
          console.warn('[respond-html] duplicate data-feedback-id "' + id + '" — reactions on these elements will collide. Assign unique IDs.');
        }
        seenIds.add(id);
        if (!el.dataset.feedbackLabel) {
          let label = '';
          if (el.classList.contains('bluf')) label = 'BLUF';
          else if (el.matches('section')) {
            const h2 = el.querySelector('h2');
            label = h2 ? h2.innerText.replace(/^\s*\d+\s+/, '').trim() : (el.id || 'Section');
          } else if (el.classList.contains('decision-block')) {
            const q = el.querySelector('.q');
            label = q ? 'Decision: ' + q.innerText.trim().slice(0, 80) : 'Decision';
          } else if (el.classList.contains('callout')) {
            const lbl = el.querySelector('.label');
            const body = el.querySelector('p');
            const kind = lbl ? lbl.innerText.trim() : 'Callout';
            const snippet = body ? body.innerText.trim().slice(0, 60) : '';
            label = kind + (snippet ? ': ' + snippet + (body.innerText.length > 60 ? '…' : '') : '');
          }
          el.dataset.feedbackLabel = label;
        }
        // Disambiguate duplicate labels by suffixing the index — the markdown export
        // reads the label, so two callouts with identical first-60-chars would be
        // indistinguishable otherwise.
        const lbl = el.dataset.feedbackLabel;
        if (lbl && seenLabels.has(lbl)) {
          const n = seenLabels.get(lbl) + 1;
          seenLabels.set(lbl, n);
          el.dataset.feedbackLabel = lbl + ' (' + n + ')';
        } else if (lbl) {
          seenLabels.set(lbl, 1);
        }
      });
    }

    // Inject reaction component on every reactable unit that doesn't already have one
    function ensureReactionUI() {
      document.querySelectorAll('section, .decision-block, .callout').forEach(el => {
        if (el.querySelector(':scope > .react')) return; // already has direct child
        if (el.classList.contains('bluf')) return; // BLUF already has explicit react in HTML
        const id = el.dataset.feedbackId;
        const react = document.createElement('div');
        react.className = 'react';
        react.dataset.target = id;
        react.innerHTML = '<span class="label">React:</span>' +
          '<button class="react-btn approve" data-r="approve" title="Approve">✅</button>' +
          '<button class="react-btn comment" data-r="comment" title="Comment">💬</button>' +
          '<button class="react-btn reject"  data-r="reject"  title="Reject">❌</button>';
        const comment = document.createElement('textarea');
        comment.className = 'react-comment';
        comment.dataset.target = id;
        comment.placeholder = 'Note…';
        el.appendChild(react);
        el.appendChild(comment);
      });
    }

    function reactionFor(id) { return state.reactions[id] || {}; }

    function applyReactionUI(id) {
      const target = document.querySelector('[data-feedback-id="' + CSS.escape(id) + '"]');
      if (!target) return;
      const r = reactionFor(id);
      if (r.reaction) target.dataset.reaction = r.reaction;
      else delete target.dataset.reaction;

      const reactEl = document.querySelector('.react[data-target="' + CSS.escape(id) + '"]');
      if (reactEl) {
        reactEl.querySelectorAll('.react-btn').forEach(b => {
          b.classList.toggle('active', b.dataset.r === r.reaction);
        });
      }
      const commentEl = document.querySelector('.react-comment[data-target="' + CSS.escape(id) + '"]');
      if (commentEl) {
        if (r.comment) {
          commentEl.value = r.comment;
          commentEl.classList.add('has-text', 'visible');
        } else if (r.reaction === 'comment') {
          commentEl.classList.add('visible');
        } else {
          commentEl.classList.remove('visible', 'has-text');
        }
      }
    }

    function updateStats() {
      const ids = new Set();
      document.querySelectorAll('[data-feedback-id]').forEach(el => ids.add(el.dataset.feedbackId));
      const counts = { approve: 0, comment: 0, reject: 0, total: ids.size };
      ids.forEach(id => {
        const r = state.reactions[id];
        if (r && r.reaction) counts[r.reaction] = (counts[r.reaction] || 0) + 1;
      });
      document.getElementById('stat-total').textContent = counts.total;
      document.getElementById('stat-approve').textContent = counts.approve;
      document.getElementById('stat-comment').textContent = counts.comment;
      document.getElementById('stat-reject').textContent = counts.reject;

      // TOC marks per section
      document.querySelectorAll('.toc a[href^="#"]').forEach(a => {
        const sid = a.getAttribute('href').slice(1);
        const old = a.parentElement.querySelector('.toc-mark');
        if (old) old.remove();
        const r = state.reactions[sid];
        if (r && r.reaction) {
          const span = document.createElement('span');
          span.className = 'toc-mark ' + r.reaction;
          span.textContent = ({approve:'✅',comment:'💬',reject:'❌'})[r.reaction];
          a.parentElement.appendChild(span);
        }
      });
    }

    function setComment(id, text) {
      const r = state.reactions[id] || {};
      r.comment = text || undefined;
      const target = document.querySelector('[data-feedback-id="' + CSS.escape(id) + '"]');
      if (target) r.label = target.dataset.feedbackLabel;
      // if the user typed but didn't pick a reaction, tag as comment
      if (text && !r.reaction) r.reaction = 'comment';
      // if they cleared the text AND the reaction was auto-comment, clear it
      if (!text && r.reaction === 'comment' && !r.reaction_explicit) r.reaction = null;
      state.reactions[id] = r;
      persist();
      applyReactionUI(id);
      updateStats();
    }

    // ============= EVENTS =============
    document.addEventListener('click', e => {
      const btn = e.target.closest('.react-btn');
      if (!btn) return;
      const id = btn.parentElement.dataset.target;
      const type = btn.dataset.r;
      const cur = (state.reactions[id] || {}).reaction;
      // mark "explicit" so clearing comment doesn't wipe an intentional reaction
      const next = cur === type ? null : type;
      const r = state.reactions[id] || {};
      r.reaction = next;
      r.reaction_explicit = !!next;
      const target = document.querySelector('[data-feedback-id="' + CSS.escape(id) + '"]');
      if (target) r.label = target.dataset.feedbackLabel;
      state.reactions[id] = r;
      // open comment box when picking 💬
      if (next === 'comment') {
        const ta = document.querySelector('.react-comment[data-target="' + CSS.escape(id) + '"]');
        if (ta) { ta.classList.add('visible'); setTimeout(() => ta.focus(), 50); }
      }
      persist();
      applyReactionUI(id);
      updateStats();
    });

    document.addEventListener('input', e => {
      const ta = e.target.closest('.react-comment');
      if (!ta) return;
      setComment(ta.dataset.target, ta.value);
    });

    // ============= COPY (markdown) =============
    function copyDecisions() {
      const sections = Array.from(document.querySelectorAll('main section[id]'));
      const title = document.title;
      const date = new Date().toISOString().slice(0, 16).replace('T', ' ');
      let md = '# Feedback — ' + title + '\n\nDate: ' + date + ' · Source: ' + location.href + '\n\n';

      // BLUF separately
      const bluf = state.reactions['bluf'];
      if (bluf && (bluf.reaction || bluf.comment)) {
        md += '## BLUF\n' + formatLine(bluf) + '\n\n';
      }

      let anyContent = !!(bluf && (bluf.reaction || bluf.comment));

      sections.forEach(section => {
        const sectionTitle = section.querySelector('h2')?.innerText.replace(/^\s*\d+\s+/, '').trim() || section.id;
        const sectionId = section.dataset.feedbackId || section.id;
        const sectionReaction = state.reactions[sectionId];
        const items = [];
        // Section-level reaction first
        if (sectionReaction && (sectionReaction.reaction || sectionReaction.comment)) {
          items.push('**Section:** ' + formatLine(sectionReaction));
        }
        // Then inner reactables (decision-blocks, callouts)
        section.querySelectorAll('[data-feedback-id]').forEach(el => {
          if (el === section) return;
          const id = el.dataset.feedbackId;
          const r = state.reactions[id];
          if (r && (r.reaction || r.comment)) {
            items.push('- ' + (r.label || id) + ' → ' + formatLine(r));
          }
        });
        if (items.length) {
          md += '## ' + sectionTitle + '\n' + items.join('\n') + '\n\n';
          anyContent = true;
        }
      });

      if (!anyContent) {
        md += '_No reactions yet. Click ✅ / 💬 / ❌ on any section, decision-block, or callout._\n';
      }

      copyToClipboard(md).then(
        ok => toast(ok ? (anyContent ? 'Copied feedback as markdown' : 'Nothing to copy yet') : 'Copy failed — markdown shown below'),
        () => toast('Copy failed — markdown shown below')
      );
    }

    // Clipboard with fallback for non-secure contexts (where navigator.clipboard is undefined).
    function copyToClipboard(text) {
      if (navigator.clipboard && window.isSecureContext) {
        return navigator.clipboard.writeText(text).then(() => true).catch(() => fallbackCopy(text));
      }
      return Promise.resolve(fallbackCopy(text));
    }
    function fallbackCopy(text) {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        if (!ok) showCopyOverlay(text);
        return ok;
      } catch (e) {
        showCopyOverlay(text);
        return false;
      }
    }
    function showCopyOverlay(text) {
      // Last-resort: surface the markdown in a modal so the user can manual-copy.
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:2rem';
      overlay.innerHTML = '<div style="background:var(--bg-elev);padding:1.5rem;border-radius:8px;max-width:60ch;max-height:80vh;overflow:auto;font-family:var(--font-head)"><h3 style="margin:0 0 0.5rem">Copy this manually (Ctrl/Cmd+A then Cmd/Ctrl+C)</h3><textarea style="width:100%;height:50vh;font-family:var(--font-mono);font-size:0.85rem;padding:0.5rem;border:1px solid var(--rule);border-radius:4px;background:var(--bg)" readonly></textarea><button onclick="this.parentElement.parentElement.remove()" style="margin-top:0.5rem;padding:0.4rem 0.8rem;border:1px solid var(--rule-strong);background:var(--bg);border-radius:4px;cursor:pointer">Close</button></div>';
      const ta = overlay.querySelector('textarea');
      ta.value = text;
      document.body.appendChild(overlay);
      setTimeout(() => ta.select(), 50);
    }

    function formatLine(r) {
      const sym = { approve: '✅ approve', reject: '❌ reject', comment: '💬 comment' }[r.reaction] || '';
      // Empty 💬 click without a typed comment: be explicit that there's no note.
      if (r.reaction === 'comment' && !r.comment) return '💬 comment (no note)';
      if (!r.comment) return sym || '(no reaction)';
      const note = r.comment.replace(/\n+/g, ' ').replace(/`/g, "'");
      if (r.reaction === 'comment' || !sym) {
        // Comment-as-primary: inline with the symbol.
        return (sym + ' — ' + note).trim();
      }
      // Reaction + separate comment: render as a nested list item so CommonMark / GitHub renders correctly (2-space continuation, not 4-space code block).
      return sym + '\n  - note: ' + note;
    }

    function clearAll() {
      if (!confirm('Clear ALL reactions and comments on this page?')) return;
      state = { reactions: {}, version: 2 };
      persist();
      document.querySelectorAll('[data-feedback-id]').forEach(el => delete el.dataset.reaction);
      document.querySelectorAll('.react-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.react-comment').forEach(t => { t.value = ''; t.classList.remove('visible', 'has-text'); });
      updateStats();
      toast('Cleared');
    }

    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('visible');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.remove('visible'), 1800);
    }

    // ============= INIT =============
    ensureIds();
    ensureReactionUI();
    document.querySelectorAll('[data-feedback-id]').forEach(el => applyReactionUI(el.dataset.feedbackId));
    updateStats();

    // ============= SCROLLSPY =============
    const sections = Array.from(document.querySelectorAll('main section[id]'));
    const tocLinks = new Map();
    document.querySelectorAll('.toc a[href^="#"]').forEach(a => tocLinks.set(a.getAttribute('href').slice(1), a));
    const io = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          tocLinks.forEach(a => a.classList.remove('active'));
          const link = tocLinks.get(e.target.id);
          if (link) link.classList.add('active');
        }
      });
    }, { rootMargin: '-20% 0px -70% 0px' });
    sections.forEach(s => io.observe(s));

    // ============= KEYBOARD =============
    // ⌘/Ctrl+Shift+C to copy decisions — skip if typing in an input/textarea (don't steal native shortcuts).
    document.addEventListener('keydown', e => {
      if ((e.metaKey || e.ctrlKey) && e.shiftKey && e.key.toLowerCase() === 'c') {
        if (e.target.matches('textarea, input, [contenteditable="true"]')) return;
        e.preventDefault();
        copyDecisions();
      }
    });
  </script>
</body>
</html>
